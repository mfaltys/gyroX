# Release pipeline: push a semver tag (v1.2.3) → build firmware in the
# official ESP-IDF environment → attach the .bin (+ sha256 sidecar) to an
# auto-generated GitHub Release. The BLE web page discovers releases via
# the GitHub API — no manifest file to maintain.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build firmware (ESP-IDF 6.0.1, esp32c3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32c3

      - name: Collect artifacts
        run: |
          VERSION=$(git describe --tags --dirty --always)
          echo "Building version: $VERSION"
          cp build/gyroX.bin "gyroX-${VERSION}.bin"
          sha256sum "gyroX-${VERSION}.bin" > "gyroX-${VERSION}.bin.sha256"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create GitHub Release (release object + notes)
        uses: softprops/action-gh-release@v2
        with:
          name: gyroX ${{ env.VERSION }}
          generate_release_notes: true   # auto changelog from commits since last tag

      - name: Upload release assets (retried — GH asset-upload flakiness)
        # For humans downloading from the releases page. The BLE web page
        # fetches from S3 instead (GitHub release-asset downloads are not
        # CORS-accessible), so a failure here never blocks the OTA path.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=5
          for attempt in $(seq 1 "$n"); do
            if gh release upload "$VERSION" "gyroX-${VERSION}.bin" "gyroX-${VERSION}.bin.sha256" --clobber; then
              echo "uploaded release assets on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt "$n" ]; then
              echo "::warning::asset upload attempt $attempt/$n failed; retrying in $((attempt * 20))s…"
              sleep $((attempt * 20))
            fi
          done
          echo "::warning::release asset upload failed after $n attempts — the BLE page still works via S3."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Upload firmware to S3 (BLE page download source)
        run: |
          aws s3 cp "gyroX-${VERSION}.bin"        "s3://unixvoid-builds/gyrox/${VERSION}/app.bin"
          aws s3 cp "gyroX-${VERSION}.bin.sha256" "s3://unixvoid-builds/gyrox/${VERSION}/app.bin.sha256"
