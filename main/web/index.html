<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32-DRIFT</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="brand">ESP32<span class="dot">-DRIFT</span></div>
    <div id="chip" class="pill">AP mode · 192.168.4.1</div>
    <div id="ver" class="pill">fw: --</div>
  </header>

  <div id="status" class="msg">Polling telemetry…</div>

  <div class="grid">
    <div class="card">
      <div class="lab">RX input</div>
      <div class="val" id="rx">0</div><div class="unit">%</div>
      <div class="bar"><div class="fill" id="rxbar"></div></div>
    </div>
    <div class="card">
      <div class="lab">Gyro rate Z</div>
      <div class="val" id="rate">0</div><div class="unit">°/s</div>
      <div class="bar"><div class="fill" id="ratebar"></div></div>
    </div>
    <div class="card">
      <div class="lab">Heading</div>
      <div class="val" id="heading">0</div><div class="unit">°</div>
      <div class="bar"><div class="fill" id="headbar"></div></div>
    </div>
    <div class="card">
      <div class="lab">Servo output</div>
      <div class="val" id="output">0</div><div class="unit">%</div>
      <div class="bar"><div class="fill" id="outbar"></div></div>
    </div>
  </div>

  <section class="panel">
    <h2>Gyro settings</h2>
    <div class="row"><label>Mode</label><select id="mMode"><option value="0">Rate</option><option value="1">Heading hold</option></select></div>
    <div class="row"><label>Gain (% per 100 °/s)</label><input type="range" id="mGain" min="0" max="200"><span id="vGain">8.0</span></div>
    <div class="row"><label>Gyro reversed</label><label class="switch"><input type="checkbox" id="mGyroRev"><span class="sl"></span></label></div>
    <div class="row"><button id="btnResetHead">Reset heading-hold target</button></div>

    <h3>Steering</h3>
    <div class="row"><label>Steering reversed</label><label class="switch"><input type="checkbox" id="mSteerRev"><span class="sl"></span></label></div>
    <div class="row"><label>Deadband (%)</label><input type="range" id="mDeadband" min="0" max="50"><span id="vDeadband">8</span></div>
    <div class="row"><label>Trim (%)</label><input type="range" id="mTrim" min="-100" max="100"><span id="vTrim">0</span></div>

    <h3>Servo (µs)</h3>
    <div class="row"><label>Min</label><input type="number" id="mSmin" min="100" max="4000"></div>
    <div class="row"><label>Center</label><input type="number" id="mScenter" min="100" max="4000"></div>
    <div class="row"><label>Max</label><input type="number" id="mSmax" min="100" max="4000"></div>

    <div class="row"><label>Gyro zero offset (°/s)</label><input type="number" id="mGzoff" step="0.001"></div>
    <div class="row act"><button id="btnCal">Calibrate gyro (car still!)</button><button id="btnSave">Save</button><button id="btnLoad">Reload</button></div>
    <div id="mMsg" class="msg"></div>
  </section>
</div>
<script>
function el(id){ return document.getElementById(id); }
function post(path, body){
  return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
}
function get(path){ return fetch(path).then(r => r.json()); }

function applyCfg(c){
  el('mMode').value = c.gyro_mode;
  el('mGain').value = c.gyro_gain; el('vGain').textContent = (c.gyro_gain / 10).toFixed(1);
  el('mGyroRev').checked = c.gyro_reverse === 1;
  el('mSteerRev').checked = c.steer_reverse === 1;
  el('mDeadband').value = c.steer_deadband; el('vDeadband').textContent = c.steer_deadband;
  el('mTrim').value = c.steer_trim; el('vTrim').textContent = c.steer_trim;
  el('mSmin').value = c.servo_min_us;
  el('mScenter').value = c.servo_center_us;
  el('mSmax').value = c.servo_max_us;
  el('mGzoff').value = c.gyro_z_offset;
}

function saveCfg(){
  const body = {
    gyro_mode: Number(el('mMode').value),
    gyro_gain: Number(el('mGain').value),
    gyro_reverse: el('mGyroRev').checked ? 1 : 0,
    steer_reverse: el('mSteerRev').checked ? 1 : 0,
    steer_deadband: Number(el('mDeadband').value),
    steer_trim: Number(el('mTrim').value),
    servo_min_us: Number(el('mSmin').value),
    servo_center_us: Number(el('mScenter').value),
    servo_max_us: Number(el('mSmax').value),
    gyro_z_offset: Number(el('mGzoff').value),
  };
  el('mMsg').textContent = 'Saving…';
  post('/api/config', body).then(async r => {
    if (!r.ok) throw new Error((await r.text()) || 'save failed');
    el('mMsg').textContent = 'Saved to NVS';
    setTimeout(() => { el('mMsg').textContent = ''; }, 1500);
  }).catch(e => { el('mMsg').textContent = 'Save failed: ' + e.message; });
}

function calibrate(){
  if (!confirm('Keep the car completely still, then press OK.')) return;
  el('mMsg').textContent = 'Calibrating gyro…';
  post('/api/calibrate').then(async r => {
    if (!r.ok) throw new Error('calibration failed');
    el('mMsg').textContent = 'Calibrated';
    loadCfg();
    setTimeout(() => { el('mMsg').textContent = ''; }, 1500);
  }).catch(e => { el('mMsg').textContent = 'Calibration failed: ' + e.message; });
}

function resetHead(){
  post('/api/reset_heading').then(() => {
    el('mMsg').textContent = 'Heading-hold target reset';
    setTimeout(() => { el('mMsg').textContent = ''; }, 1000);
  });
}

function loadCfg(){ get('/api/config').then(applyCfg).catch(() => {}); }

function loadState(){
  get('/api/state').then(s => {
    el('rx').textContent = s.rx;
    el('rate').textContent = s.rate_z;
    el('heading').textContent = s.heading.toFixed(1);
    el('output').textContent = s.output;
    const bar = (id, v, lo, hi) => {
      const f = el(id); let p = (v - lo) / (hi - lo) * 100;
      if (p < 0) p = 0; if (p > 100) p = 100;
      f.style.width = p + '%';
    };
    bar('rxbar', s.rx, -100, 100);
    bar('ratebar', s.rate_z, -200, 200);
    bar('headbar', s.heading, -180, 180);
    bar('outbar', s.output, -100, 100);
    el('status').textContent = (s.rx_valid ? 'RX OK' : 'NO RX!') + '  ·  gyro ' + (s.gyro_ready ? 'OK' : '---');
  }).catch(() => {});
}

get('/api/version').then(r => { if (r.version) el('ver').textContent = 'fw: ' + r.version; });

['mGain', 'mDeadband', 'mTrim'].forEach(id => {
  el(id).addEventListener('input', () => {
    const d = id === 'mGain' ? 'vGain' : id === 'mDeadband' ? 'vDeadband' : 'vTrim';
    let v = el(id).value;
    if (id === 'mGain') v = (Number(v) / 10).toFixed(1);
    el(d).textContent = v;
  });
});

el('btnSave').onclick = saveCfg;
el('btnLoad').onclick = loadCfg;
el('btnCal').onclick = calibrate;
el('btnResetHead').onclick = resetHead;

setInterval(loadState, 200);
loadCfg();
loadState();
</script>
</body>
</html>
